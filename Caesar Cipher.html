<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mã Caesar</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        input, button { margin: 5px; }
        #output { margin-top: 10px; color: green; }
    </style>
</head>
<body>
    <h2>Mã Caesar (Khóa cố định: 3)</h2>
    <input type="text" id="text" placeholder="Nhập văn bản">
    <button onclick="encrypt()">Mã hóa</button>
    <button onclick="decrypt()">Giải mã</button>
    <div id="output"></div>

    <script>
        function caesarShift(text, encrypt = true) {
            const key = 3;
            const shift = encrypt ? key : 26 - key;
            let result = "";
            for (let i = 0; i < text.length; i++) {
                let c = text.charCodeAt(i);
                if (c >= 65 && c <= 90) {
                    result += String.fromCharCode((c - 65 + shift) % 26 + 65);
                } else if (c >= 97 && c <= 122) {
                    result += String.fromCharCode((c - 97 + shift) % 26 + 97);
                } else {
                    result += text[i];
                }
            }
            return result;
        }

        function encrypt() {
            let text = document.getElementById("text").value;
            document.getElementById("output").innerText = "Mã hóa: " + caesarShift(text, true);
        }

        function decrypt() {
            let text = document.getElementById("text").value;
            document.getElementById("output").innerText = "Giải mã: " + caesarShift(text, false);
        }
    </script>
</body>
</html>
