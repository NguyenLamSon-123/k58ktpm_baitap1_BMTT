<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mã Playfair</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        input, button { margin: 5px; }
        #output { margin-top: 10px; color: green; }
    </style>
</head>
<body>
    <h2>Mã Playfair</h2>
    <input type="text" id="text" placeholder="Nhập văn bản">
    <input type="text" id="key" placeholder="Khóa">
    <button onclick="encrypt()">Mã hóa</button>
    <button onclick="decrypt()">Giải mã</button>
    <div id="output"></div>

    <script>
        class Playfair {
            constructor(key) {
                this.matrix = this.buildMatrix(key);
            }
            buildMatrix(key) {
                let alphabet = "ABCDEFGHIKLMNOPQRSTUVWXYZ";
                let uniqueKey = "";
                for (let c of (key + alphabet).toUpperCase().replace(/J/g, 'I')) {
                    if (uniqueKey.indexOf(c) === -1 && /[A-Z]/.test(c)) {
                        uniqueKey += c;
                    }
                }
                let matrix = [];
                for (let i = 0; i < 5; i++) {
                    matrix.push(uniqueKey.slice(i*5, (i+1)*5).split(''));
                }
                return matrix;
            }
            findPos(c) {
                c = c.toUpperCase().replace('J', 'I');
                for (let i = 0; i < 5; i++) {
                    for (let j = 0; j < 5; j++) {
                        if (this.matrix[i][j] === c) return [i, j];
                    }
                }
                return [-1, -1];
            }
            prepareText(text) {
                let prepared = "";
                for (let c of text.toUpperCase().replace(/J/g, 'I')) {
                    if (/[A-Z]/.test(c)) prepared += c;
                }
                let i = 0;
                while (i < prepared.length) {
                    if (i === prepared.length - 1) {
                        prepared += 'X';
                        break;
                    }
                    if (prepared[i] === prepared[i+1]) {
                        prepared = prepared.slice(0, i+1) + 'X' + prepared.slice(i+1);
                    }
                    i += 2;
                }
                return prepared;
            }
            crypt(text, encrypt = true) {
                text = this.prepareText(text);
                let result = "";
                let dir = encrypt ? 1 : 4;  // 4 là -1 mod 5
                for (let i = 0; i < text.length; i += 2) {
                    let [r1, c1] = this.findPos(text[i]);
                    let [r2, c2] = this.findPos(text[i+1]);
                    if (r1 === r2) {
                        result += this.matrix[r1][(c1 + dir + 5) % 5];
                        result += this.matrix[r2][(c2 + dir + 5) % 5];
                    } else if (c1 === c2) {
                        result += this.matrix[(r1 + dir + 5) % 5][c1];
                        result += this.matrix[(r2 + dir + 5) % 5][c2];
                    } else {
                        result += this.matrix[r1][c2];
                        result += this.matrix[r2][c1];
                    }
                }
                if (!encrypt) result = result.replace(/X/g, '');
                return result;
            }
        }

        function encrypt() {
            let text = document.getElementById("text").value;
            let key = document.getElementById("key").value;
            let pf = new Playfair(key);
            document.getElementById("output").innerText = "Mã hóa: " + pf.crypt(text, true);
        }

        function decrypt() {
            let text = document.getElementById("text").value;
            let key = document.getElementById("key").value;
            let pf = new Playfair(key);
            document.getElementById("output").innerText = "Giải mã: " + pf.crypt(text, false);
        }
    </script>
</body>
</html>
